[project]
name = "deployar"
version = "0.1.0"
description = "Deployar agent: Liara deploy + SRE loop on the Claude Agent SDK"
authors = [
    { name = "amircodington", email = "amircodington@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "arq>=0.28.0",
    "asyncpg>=0.32.0",
    "claude-agent-sdk==0.2.172",
    "cryptography>=50.0.2",
    "fastapi>=0.159.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.1",
    "redis>=5.3.1",
    "sqlalchemy[asyncio]>=2.1.6",
    "structlog>=26.1.0",
    "uuid-utils>=1.1.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
deployar-agent = "deployar.main:run"
deployar-seed = "deployar.seed:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.13"
files = ["src"]
# Strict where the gate and secrets live (ARCHITECTURE.md §11).
[[tool.mypy.overrides]]
module = ["deployar.core.*", "deployar.runtime.*", "deployar.tools.*"]
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
