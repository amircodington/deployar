# The agent runs on the host for the Claude Code login (ADR 11); web reaches it via host.docker.internal.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: deployar
      POSTGRES_PASSWORD: deployar
      POSTGRES_DB: deployar
    command: ["postgres", "-c", "log_parameter_max_length=0", "-c", "log_statement=ddl"]
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deployar"]
      interval: 5s
  redis:
    image: redis:7
    ports: ["127.0.0.1:6379:6379"]
  worker:
    build: ./agent
    environment:
      DATABASE_URL: postgresql+asyncpg://deployar:deployar@postgres:5432/deployar
      REDIS_URL: redis://redis:6379/0
    volumes: [./agent/src:/app/src]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
  web:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm dev -H 0.0.0.0"
    environment:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      AGENT_URL: http://host.docker.internal:8800
    ports: ["127.0.0.1:3800:3000"]
    volumes: [./web:/app, web_node_modules:/app/node_modules, web_next:/app/.next]
volumes:
  pgdata:
  web_node_modules:
  web_next:
