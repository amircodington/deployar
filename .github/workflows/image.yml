name: image
# Builds the one-container production image (deploy/Dockerfile) for Liara, which only pulls it (decision 16).
on:
  push:
    branches: [main]
    paths: ["agent/**", "web/**", "deploy/**", ".github/workflows/image.yml"]
  workflow_dispatch:
permissions:
  contents: write  # the pin step below commits the root Dockerfile
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/amircodington/deployar:latest
            ghcr.io/amircodington/deployar:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/amircodington/deployar
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Liara's builder keeps an old copy of :latest and never re-pulls it, so the root Dockerfile names this exact
      # build. The pin commit only touches Dockerfile, which this workflow's paths filter ignores (no loop).
      - name: Pin the image Liara pulls
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          sed -i "s|^FROM ghcr.io/amircodington/deployar:.*|FROM ghcr.io/amircodington/deployar:${GITHUB_SHA}|" Dockerfile
          git diff --quiet || { git commit -am "ci: pin the Liara image to ${GITHUB_SHA::7}" && git push origin HEAD:main; }
