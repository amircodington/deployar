<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;800&family=JetBrains+Mono:wght@400&display=swap">
<style>html,body{margin:0;background:var(--shell);color:var(--ink);font-family:var(--font-sans)} .wrap{padding:24px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start} .mono{font-family:var(--font-mono);direction:ltr;unicode-bidi:isolate;font-size:12px}
.card{background:var(--card);border-radius:var(--radius-lg);padding:24px;width:420px;max-width:100%;display:grid;gap:4px}
h3{margin:0;font-size:18px;font-weight:500} .sub{font-size:13px;color:var(--ink-muted)}
.num{font-size:40px;line-height:44px;font-weight:300;margin-top:14px;font-variant-numeric:tabular-nums} .cap{font-size:13px;color:var(--ink-muted);padding-bottom:10px;border-bottom:1px solid var(--line)}
.bars{display:grid;grid-template-columns:repeat(9,1fr);gap:8px;align-items:end;height:120px;margin-top:12px}
.bars i{display:block;background:var(--peach);border-radius:14px 14px 10px 10px}
.bars i.now{background:var(--amber)}
.days{display:grid;grid-template-columns:repeat(9,1fr);gap:8px;text-align:center;font-size:12px;color:var(--ink-muted)}
.days .now{background:var(--amber);color:var(--on-amber);border-radius:var(--radius-pill);justify-self:center;padding:0 8px}
</style>
<div class="wrap" dir="rtl"><div class="card">
 <h3>زمان پاسخ</h3><span class="sub">میانگین روزانه، ۹ روز اخیر · get_metrics</span>
 <span class="num">۴٬۱۸۰</span><span class="cap">میلی‌ثانیه، امروز</span>
 <div class="bars" aria-hidden="true"><i style="height:22%"></i><i style="height:30%"></i><i style="height:14%"></i><i style="height:40%"></i><i style="height:26%"></i><i style="height:20%"></i><i style="height:10%"></i><i style="height:62%"></i><i class="now" style="height:96%"></i></div>
 <div class="days"><span>۱</span><span>۲</span><span>۳</span><span>۴</span><span>۵</span><span>۶</span><span>۷</span><span>۸</span><span class="now">۹</span></div>
</div></div>
