<!-- @dsCard height=288 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;800&display=swap">
<style>
  html,body{margin:0;background:var(--ground);height:288px;overflow:hidden}
  .cover{position:relative;width:960px;height:288px}
  svg{position:absolute;inset:0}
  .ink{fill:var(--ink)} .amber{fill:var(--amber)} .peach{fill:var(--peach)} .mint{fill:var(--mint)} .shell{fill:var(--shell)}
  .name{position:absolute;left:48px;bottom:44px;width:440px;font-family:var(--font-sans);font-weight:800;font-size:100px;line-height:.95;color:var(--ink);direction:rtl;text-align:left;margin:0}
  .tag{position:absolute;left:48px;bottom:18px;width:440px;font-family:var(--font-sans);font-size:14px;line-height:1.3;color:var(--ink-muted);direction:rtl;text-align:left;margin:0}
</style>
<div class="cover">
  <!--
    blocks: ink pill 432×56 (the approval track, radius-pill), amber knob 96×44 (radius-pill), peach bars 32 wide (radius 16 = half width), one amber bar, mint disc 24 (radius-pill)
    arrangement: a strip of unequal bars rising toward the right edge under one long slider pill, all right of x=480, the tallest bar bleeding off the top
    pattern: "soft, friendly, large radii → pills" — the brand's two signatures are the gradient-knob approval slider and the rounded-top bar chart, so both are drawn as pills
    scales: bar width space-8 (32px), gap space-4 (16px), track height 56 (space-12 + space-2), radius = half the short side everywhere
  -->
  <svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
    <rect class="ink" x="504" y="28" width="432" height="56" rx="28"/>
    <rect class="amber" x="834" y="34" width="96" height="44" rx="22"/>
    <circle class="mint" cx="540" cy="56" r="12"/>
    <rect class="peach" x="504" y="212" width="32" height="56" rx="16"/>
    <rect class="peach" x="552" y="188" width="32" height="80" rx="16"/>
    <rect class="peach" x="600" y="228" width="32" height="40" rx="16"/>
    <rect class="peach" x="648" y="164" width="32" height="104" rx="16"/>
    <rect class="peach" x="696" y="204" width="32" height="64" rx="16"/>
    <rect class="peach" x="744" y="220" width="32" height="48" rx="16"/>
    <rect class="peach" x="792" y="236" width="32" height="32" rx="16"/>
    <rect class="peach" x="840" y="116" width="32" height="152" rx="16"/>
    <rect class="amber" x="888" y="100" width="32" height="168" rx="16"/>
  </svg>
  <p class="name">دیپلویار</p>
  <p class="tag">تو محصولت را بساز؛ آنلاین و سالم نگه‌داشتنش با من، با تأیید تو.</p>
</div>
